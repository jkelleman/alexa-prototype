name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill/lambda
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - name: Transcripts match the engine
        run: npm run transcripts && git diff --exit-code ../../design/transcripts.md
      - name: Web demo scripts parse
        run: node --check ../../app.js && node --check dialog.js
